<title>IronMap Premium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: glass cards on a dark stage; one neon moment = the muscle avatar. Floating pill tab bar, bottom sheets for analytics. */
:root{color-scheme:dark;--bg:#07090F;--surface:#0E1320;--hi:#151C2E;--line:rgba(255,255,255,.08);--tx:#EAF0FF;--mut:#7C89A8;--act:#5B8CFF;--r1:#6B7FA8;--r2:#2DE08A;--r3:#FF8A1F;--r4:#FFD43B;--hot:#FF3D5A;--f-d:'Sora',system-ui,sans-serif;--f-b:'Inter',system-ui,sans-serif;--f-m:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--f-b)}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 520px at 75% -10%,#1b2a5a66,transparent 60%),radial-gradient(700px 500px at -10% 45%,#3a1b5a40,transparent 60%);pointer-events:none;z-index:-1}
h1,h2,h3{font-family:var(--f-d);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px;font-weight:700}h2{font-size:19px;font-weight:600}h3{font-size:15px;font-weight:600}
p{margin:0}.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:11px}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.page{max-width:680px;margin:0 auto;padding-top:18px;padding-bottom:190px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:rise .4s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 50px -28px #000;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:600 14px var(--f-b);color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}.btn:focus-visible,input:focus-visible,select:focus-visible,[data-act]:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.btn.pri{background:var(--act);border-color:var(--act);color:#fff;box-shadow:0 10px 30px -12px var(--act)}
.btn.red{color:var(--hot)}.btn.full{width:100%}.btn.s{padding:8px 12px;font-size:13px;border-radius:12px}
.ico{background:none;border:0;color:var(--mut);font-size:17px;cursor:pointer;padding:6px 8px;border-radius:10px}
input,select{width:100%;font:16px var(--f-b);color:var(--tx);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
select option{background:var(--surface)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 5px;letter-spacing:.04em;text-transform:uppercase}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0;background:rgba(255,255,255,.06);color:var(--mut)}
.pill.p{background:#FF3D5A22;color:#FF7A90}.pill.s{background:#FF8A1F1c;color:#FFA94D}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 13px var(--f-b);color:var(--mut);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer}
.chip.on{color:#fff;background:var(--act);border-color:var(--act)}
/* nav */
nav{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;display:flex;background:rgba(14,19,32,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;z-index:5;box-shadow:0 20px 50px -10px #000}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mut);font:500 10.5px var(--f-b);padding:8px 0;border-radius:20px;cursor:pointer;position:relative;transition:color .2s,background .2s}
nav button.on{color:#fff;background:rgba(91,140,255,.18)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav i{position:absolute;top:6px;right:26%;width:8px;height:8px;border-radius:50%;background:var(--r2);box-shadow:0 0 8px var(--r2)}
.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;z-index:4}
.fab .btn{height:52px;font:600 16px var(--f-d);border-radius:18px}
#rest{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;background:var(--act);color:#fff;font-weight:600;border-radius:16px;padding:12px 16px;display:none;justify-content:space-between;z-index:6;box-shadow:0 12px 40px -10px var(--act)}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
#toast div{background:rgba(21,28,46,.96);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 14px 40px -10px #000;animation:rise .35s}
/* avatar */
.stage{position:relative;padding:10px 10px 14px;overflow:hidden}
.stage svg.av{width:100%;max-width:330px;display:block;margin:0 auto;height:auto}
.av g.m{cursor:pointer}.av path.mp{transition:fill .8s,stroke .2s}
.av g.m:hover{filter:brightness(1.25)}
@keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes flash{0%{transform:scale(1);opacity:1}35%{transform:scale(1.12);opacity:.55}100%{transform:scale(1);opacity:1}}
.av g.m.elite{animation:breathe 2.4s ease-in-out infinite}
.av g.m.flash{animation:flash 1.1s ease-out 2;transform-box:fill-box;transform-origin:center}
.seg{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;padding:4px}
.seg button{font:500 13px var(--f-b);border:0;background:none;color:var(--mut);border-radius:99px;padding:7px 16px;cursor:pointer}
.seg button.on{background:var(--act);color:#fff}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;transition:width .8s}
.mrow{display:grid;grid-template-columns:116px 1fr 22px;gap:10px;align-items:center;padding:7px 0;font-size:14px;cursor:pointer}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font:600 24px var(--f-d)}
/* illustrations */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ill-box{margin:0;height:158px;display:grid;place-items:center;border-radius:18px;background:radial-gradient(120px 90px at 50% 40%,#16203a,#0A0F1B);border:1px solid var(--line);position:relative;overflow:hidden}
.ill-box svg{width:100%;height:100%;padding:8px}
.ill-box figcaption{position:absolute;left:10px;bottom:7px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ill .fg polyline{fill:none;stroke:#EAF0FF;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.ill .hd{fill:#EAF0FF}.ill .eq{fill:none;stroke:#3B4868;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ill rect.eq{fill:#0E1526}.ill .mv{fill:none;stroke:#5B8CFF;stroke-width:3.5;stroke-linecap:round}
.ill .pl{fill:#5B8CFF2a;stroke:#5B8CFF;stroke-width:3}.ill .ar{fill:none;stroke:#FFD43B;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ah);stroke-dasharray:3 3}
/* catalog */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lcard{display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--tx);font:inherit;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;cursor:pointer;min-width:0;transition:transform .2s,border-color .2s}
.lcard:hover{transform:translateY(-2px);border-color:rgba(91,140,255,.5)}
.lthumb{height:104px;display:grid;place-items:center;border-radius:14px;background:radial-gradient(100px 70px at 50% 40%,#16203a,#0A0F1B);overflow:hidden}
.lthumb svg{width:100%;height:100%;padding:4px}
.brand{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--act)}
.lcard b{font:600 13px/1.25 var(--f-d)}
.prow{display:grid;grid-template-columns:78px 40px 1fr;gap:10px;align-items:center;width:100%;text-align:left;color:var(--tx);font:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer}
.prow .t1{height:60px;border-radius:12px;background:#0A0F1B;display:grid;place-items:center}.prow svg{width:100%;height:100%;padding:3px}
.prow .t2{height:60px;border-radius:10px;background:#0A0F1B;display:grid;place-items:center}
/* sets */
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 50px 24px;gap:8px;align-items:center;margin:8px 0}
.setrow input{text-align:center;padding:13px 4px;font:500 18px var(--f-m);border-radius:14px}
.dn{height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--mut);font-size:18px;cursor:pointer;transition:all .2s}
.dn.on{background:var(--r2);border-color:var(--r2);color:#04210f;box-shadow:0 0 18px -4px var(--r2)}
.ix{background:none;border:0;color:var(--mut);font:500 13px var(--f-m);cursor:pointer}.ix.w{color:var(--r4)}
.hdr{display:grid;grid-template-columns:34px 1fr 1fr 50px 24px;gap:8px;font-size:10px;color:var(--mut);text-align:center;letter-spacing:.1em;text-transform:uppercase}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;margin:-4px 0;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.prog .bar{height:6px}.prog .bar i{background:var(--act);box-shadow:0 0 12px var(--act)}
/* modals */
.ov{position:fixed;inset:0;background:rgba(2,4,10,.7);backdrop-filter:blur(4px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,680px);max-height:90vh;overflow:auto;background:rgba(21,28,46,.97);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 60px -20px #000;animation:up .38s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:4px auto 14px}
.tip{background:rgba(255,255,255,.05);border-radius:14px;padding:11px 13px;font-size:14px}
svg text{fill:#7C89A8;font:10px var(--f-b)}
.chk{display:inline-flex;gap:6px;align-items:center;margin:0 10px 6px 0;font-size:14px;color:var(--tx);text-transform:none;letter-spacing:0}.chk input{width:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  const ln=levels(),lp=levels(now-7*DAY);let gain=null,lag=null;Object.keys(ln).forEach(m=>{const g=ln[m].level-(lp[m]?lp[m].level:ln[m].level);if(!gain||g>gain.g)gain={m,g};if(!lag||ln[m].level<lag.l)lag={m,l:ln[m].level}});
  let h=`<div><div class="eyebrow">Charts and reports</div><h1>Progress</h1></div>
  <div class="card"><h3>Weekly report</h3><div class="grid2" style="margin-top:10px"><div class="stat"><span class="mut xs">Sessions</span><b class="mono">${w1.length}</b><span class="mut xs">previous week ${w2.length}</span></div><div class="stat"><span class="mut xs">Tonnage</span><b class="mono">${wt(t1)}</b><span class="xs" style="color:${dl==null?'var(--mut)':dl>=0?'var(--r2)':'var(--hot)'}">${dl==null?'no previous week':(dl>=0?'+':'')+dl+'% vs previous'}</span></div></div>
  ${gain&&gain.g>.01?`<div class="tip" style="margin-top:10px">Biggest gain: <b>${MUSCLES[gain.m]}</b> (+${gain.g.toFixed(2)} level this week).</div>`:''}${lag&&Object.keys(ln).length>3?`<div class="tip" style="margin-top:8px">Lagging muscle: <b>${MUSCLES[lag.m]}</b> at level ${lag.l.toFixed(1)}. Consider adding volume.</div>`:''}</div>
  <div class="card"><h3>Tonnage per session (${S.unit})</h3>${barChart(S.sessions.slice(-16).map(s=>({x:fmtD(s.t),y:toD(s.tonnage)})))}</div>`;
  const mon={};S.sessions.forEach(s=>{const k=new Date(s.t).toLocaleDateString('en-GB',{month:'short',year:'numeric'});mon[k]=(mon[k]||0)+s.tonnage});
  if(Object.keys(mon).length)h+=`<div class="card"><h3>Tonnage per month</h3>${Object.entries(mon).map(([k,v])=>`<div class="row" style="padding:7px 0;border-top:1px solid var(--line);margin-top:6px"><span class="mut">${k}</span><b class="mono">${Math.round(toD(v)).toLocaleString('en-GB')} ${S.unit}</b></div>`).join('')}</div>`;
  if(done.length){const pts=S.sessions.map(s=>{const v=s.sets.filter(x=>x.ex===UI.progEx&&!x.warm).map(x=>est1(loadOf(EXM[UI.progEx],x.w),x.r)).filter(Boolean);return v.length?{x:fmtD(s.t),y:toD(Math.max(...v))}:null}).filter(Boolean);
    h+=`<div class="card"><h3>Estimated 1RM (${S.unit})</h3><select data-in="progEx" style="margin:10px 0" aria-label="Exercise">${done.map(id=>`<option value="${id}" ${id===UI.progEx?'selected':''}>${esc(EXM[id].full)}</option>`).join('')}</select>${areaChart(pts,'#FF8A1F')}</div>`}
  h+=`<div class="card"><h3>Body weight (${S.unit})</h3>${areaChart(S.weights.map(w=>({x:fmtD(w.t),y:toD(w.kg)})),'#2DE08A')}</div>
  <div class="card"><h3>History</h3>`+([...S.sessions].reverse().slice(0,30).map(s=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--line);margin-top:6px"><div style="min-width:0"><b class="sm">${esc(s.title)}</b>${s.demo?' <span class="pill">demo</span>':''}<div class="mut xs">${fmtD(s.t)} · ${s.sets.length} sets · ${wt(s.tonnage)}</div></div><button class="ico" data-act="delSes" data-a="${s.id}" aria-label="Delete session">✕</button></div>`).join('')||'<p class="mut sm">No sessions yet.</p>')+'</div>';
  return h}
function vMe(){const P=S.profile||{sex:'M',age:25,height:175,weight:75},R=S.remind,DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return`<div><div class="eyebrow">${S.profile?'Settings':'Welcome'}</div><h1>${S.profile?'Profile':'Set up your profile'}</h1></div>${S.profile?'':'<p class="mut">Sex, age, height and body weight feed the strength standards behind your muscle ranks.</p>'}
  <div class="card"><div class="grid2"><div><label for="p_sex">Sex</label><select id="p_sex"><option value="M" ${P.sex==='M'?'selected':''}>Male</option><option value="F" ${P.sex==='F'?'selected':''}>Female</option></select></div><div><label for="p_age">Age</label><input id="p_age" type="number" inputmode="numeric" value="${P.age}"></div><div><label for="p_h">Height, cm</label><input id="p_h" type="number" inputmode="decimal" value="${P.height}"></div><div><label for="p_w">Body weight, ${S.unit}</label><input id="p_w" type="number" inputmode="decimal" value="${toD(P.weight)}"></div></div>
  <label for="p_u">Units</label><select id="p_u"><option value="kg" ${S.unit==='kg'?'selected':''}>Kilograms (kg)</option><option value="lbs" ${S.unit==='lbs'?'selected':''}>Pounds (lbs)</option></select>
  <button class="btn pri full" style="margin-top:14px" data-act="saveProfile">${S.profile?'Save and recalculate ranks':'Save and continue'}</button></div>
  <div class="card"><h3>Reminders</h3><label class="chk" style="margin-top:10px"><input type="checkbox" id="r_on" ${R.on?'checked':''}>Remind me to train</label><div style="margin:6px 0">${DN.map((n,i)=>`<label class="chk"><input type="checkbox" class="r_d" value="${i+1}" ${R.days.includes(i+1)?'checked':''}>${n}</label>`).join('')}</div><label for="r_t">Time</label><input type="time" id="r_t" value="${R.time}"><button class="btn full" style="margin-top:12px" data-act="saveRemind">Save reminders</button><p class="mut xs" style="margin-top:8px">Browser notifications work while this page is open. Push notifications and email reports need the server version.</p></div>
  <div class="card"><h3>Data</h3><div class="col" style="margin-top:10px"><button class="btn s" data-act="demo">Load 8 weeks of demo data</button><button class="btn s" data-act="rmDemo">Remove demo data</button><button class="btn s" data-act="export">Copy backup (JSON) to clipboard</button><div><label for="imp">Import backup file</label><input id="imp" type="file" accept=".json" data-in="imp"></div><button class="btn s red" data-act="reset">Erase everything</button></div></div>`}
function vAsk(){return`<div class="ov" style="align-items:center;padding:16px"><div class="card" style="width:min(100%,380px);background:var(--hi)"><p>${esc(UI.ask.msg)}</p><div class="grid2" style="margin-top:16px"><button class="btn" data-act="askNo">Cancel</button><button class="btn pri" data-act="askYes">Confirm</button></div></div></div>`}
function ask(msg,fn){UI.ask={msg,fn};render()}
function render(){const y=window.scrollY;if(!S.profile)UI.tab='me';
  const body={home:vHome,lib:vLib,train:vTrain,stats:vStats,me:vMe}[UI.tab]();
  const tabs=[['home','Home'],['lib','Library'],['train','Train'],['stats','Progress'],['me','Profile']];
  $('#app').innerHTML=`<main class="page" key="${UI.tab}">${body}</main>${UI.tab==='home'&&S.profile?vFab():''}<nav aria-label="Main">${tabs.map(t=>`<button class="${UI.tab===t[0]?'on':''}" data-act="tab" data-a="${t[0]}"><svg viewBox="0 0 24 24">${ICON[t[0]]}</svg>${t[1]}${t[0]==='train'&&S.active?'<i></i>':''}</button>`).join('')}</nav>${UI.sel&&UI.tab==='home'?vSheet():''}${UI.pick?vPick():''}${UI.detail?vDetail():''}${UI.ask?vAsk():''}`;
  window.scrollTo(0,y)}
/* ============================== ACTIONS ============================== */
const ACT={
 askYes(){const f=UI.ask.fn;UI.ask=null;render();f()},askNo(){UI.ask=null;render()},skipRest(){UI.restEnd=0},
 tab(a){UI.tab=a;UI.editProg=null;UI.sel=null;window.scrollTo(0,0);render()},
 view(a){UI.view=a;render()},sel(a){UI.sel=a||null;render()},
 closeSheet(a,b,c,el,ev){if(el.dataset.self&&ev.target!==el)return;UI.sel=null;render()},
 libBrand(a){UI.lib.brand=a;render()},pkBrand(a){UI.pick.brand=a;render()},
 detail(a){UI.detail=a;render()},closeDetail(a,b,c,el,ev){if(el.dataset.self&&ev.target!==el)return;UI.detail=null;render()},
 addToWorkout(a){S.active.ex.push(mkEx(a));save();UI.detail=null;UI.tab='train';toast('Added to your workout');render()},
 newProg(a){const n=a||($('#pname').value.trim())||'My plan',days=(TEMPLATES[a]||[['Day A',[]],['Day B',[]]]).map(d=>({id:uid(),title:d[0],ex:[...d[1]]})),p={id:uid(),name:n,days};S.programs.push(p);save();UI.editProg=p.id;render()},
 editProg(a){UI.editProg=a;render()},closeEdit(){UI.editProg=null;render()},
 delProg(a){ask('Delete this plan?',()=>{S.programs=S.programs.filter(p=>p.id!==a);save();UI.editProg=null;render()})},
 addDay(){const p=S.programs.find(x=>x.id===UI.editProg);p.days.push({id:uid(),title:'Day '+(p.days.length+1),ex:[]});save();render()},
 delDay(a){const p=S.programs.find(x=>x.id===UI.editProg);if(p.days.length>1)ask('Delete this day?',()=>{p.days=p.days.filter(d=>d.id!==a);save();render()})},
 mvEx(a,b,c){const d=S.programs.find(x=>x.id===UI.editProg).days.find(x=>x.id===a),i=+b,j=i+ +c;if(j<0||j>=d.ex.length)return;[d.ex[i],d.ex[j]]=[d.ex[j],d.ex[i]];save();render()},
 rmEx(a,b){S.programs.find(x=>x.id===UI.editProg).days.find(x=>x.id===a).ex.splice(+b,1);save();render()},
 openPick(a,b){UI.pick={mode:a,dayId:b,q:'',brand:'ALL',m:'',eq:''};render()},
 closePick(a,b,c,el,ev){if(el.dataset.self&&ev.target!==el)return;UI.pick=null;render()},
 pickEx(a){const p=UI.pick;if(p.mode==='prog')S.programs.find(x=>x.id===UI.editProg).days.find(x=>x.id===p.dayId).ex.push(a);else S.active.ex.push(mkEx(a));UI.pick=null;save();render()},
 startW(a,b){startW(a,b)},
 cancelW(){ask('Discard this workout? Entered sets will be lost.',()=>{S.active=null;UI.restEnd=0;save();render()})},
 finish(){finishW()},
 rmWEx(a){S.active.ex.splice(+a,1);save();render()},
 addSet(a){const x=S.active.ex[+a],l=x.sets[x.sets.length-1]||{w:0,r:0};x.sets.push({w:l.w,r:l.r,done:false,warm:false});save();render()},
 rmSet(a,b){S.active.ex[+a].sets.splice(+b,1);save();render()},
 warm(a,b){const s=S.active.ex[+a].sets[+b];s.warm=!s.warm;save();render()},
 done(a,b){const s=S.active.ex[+a].sets[+b];s.done=!s.done;if(s.done&&!s.warm)UI.restEnd=Date.now()+90000;if(navigator.vibrate)navigator.vibrate(15);save();render()},
 delSes(a){ask('Delete this session from history?',()=>{S.sessions=S.sessions.filter(s=>s.id!==a);save();render()})},
 saveProfile(){const sex=$('#p_sex').value,age=+$('#p_age').value,height=+$('#p_h').value,u=$('#p_u').value,wv=+$('#p_w').value,weight=u==='lbs'?wv*LB:wv;
   if(!(age>=10&&age<=100&&height>=100&&height<=250&&weight>=30&&weight<=300)){toast('Check your values: age, height and weight look out of range.');return}
   S.unit=u;const ch=!S.profile||Math.abs(S.profile.weight-weight)>.01;S.profile={sex,age,height,weight:+weight.toFixed(2)};if(ch)S.weights.push({t:Date.now(),kg:S.profile.weight});
   save();toast('Profile saved. Ranks recalculated.');UI.tab='home';render()},
 saveRemind(){S.remind={on:$('#r_on').checked,days:[...document.querySelectorAll('.r_d:checked')].map(x=>+x.value),time:$('#r_t').value||'18:30'};
   try{if(S.remind.on&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(p=>toast(p==='granted'?'Notifications allowed':'Notifications are blocked in this browser'))}catch(e){}
   save();toast('Reminders saved')},
 demo(){if(!S.profile){toast('Save your profile first.');return}
   const A=[['bench',60,8],['ohp',40,8],['row_bb',60,8],['tg_vt',55,10],['curl_bb',25,10],['pushdown',30,12],['lateral',8,12]],B=[['squat',80,8],['rdl',70,8],['tg_lp',140,10],['hipthrust',80,10],['hs_calf',60,12],['tg_ab',30,12],['deadlift',100,5]];
   S.sessions=S.sessions.filter(s=>!s.demo);
   for(let w=0;w<8;w++)for(let d=0;d<2;d++){const L=d?B:A,t=Date.now()-(8-w)*7*DAY+d*2*DAY,sets=[];
     L.forEach(([ex,base,r])=>{const v=Math.round(base*(1+.03*w)/2.5)*2.5;for(let k=0;k<3;k++)sets.push({ex,w:v,r,warm:false})});
     S.sessions.push({id:uid(),t,end:t+36e5,progId:null,dayId:null,title:d?'Demo: Lower':'Demo: Upper',bw:S.profile.weight,tonnage:Math.round(sets.reduce((a,s)=>a+loadOf(EXM[s.ex],s.w)*s.r,0)),sets,demo:true})}
   S.sessions.sort((a,b)=>a.t-b.t);save();toast('Demo data loaded');UI.tab='home';render()},
 rmDemo(){S.sessions=S.sessions.filter(s=>!s.demo);save();toast('Demo data removed');render()},
 export(){try{navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Backup copied to clipboard'),()=>toast('Could not copy. Try again.'))}catch(e){toast('Could not copy. Try again.')}},
 reset(){ask('Erase all data? This cannot be undone.',()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();UI.tab='me';render()})}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el.dataset.a,el.dataset.b,el.dataset.c,el,ev)});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('g[data-act]')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
function refilter(pre){const f=pre==='lib'?UI.lib:UI.pick,r=libList(f);if(pre==='lib')$('#liblist').innerHTML=r.html;else $('#pklist').innerHTML=pickRows(r.items)}
document.addEventListener('input',ev=>{const t=ev.target,k=t.dataset.in;if(!k)return;
  if(k==='w'||k==='r'){const s=S.active.ex[+t.dataset.a].sets[+t.dataset.b];if(k==='w')s.w=fromD(parseFloat(t.value.replace(',','.'))||0);else s.r=parseInt(t.value)||0;save()}
  else if(k==='libq'){UI.lib.q=t.value;refilter('lib')}else if(k==='pkq'){UI.pick.q=t.value;refilter('pk')}
  else if(k==='progName'){S.programs.find(p=>p.id===UI.editProg).name=t.value;save()}
  else if(k==='dayTitle'){S.programs.find(p=>p.id===UI.editProg).days.find(d=>d.id===t.dataset.a).title=t.value;save()}});
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset.in;if(!k)return;
  if(k==='libm'){UI.lib.m=t.value;refilter('lib')}else if(k==='libe'){UI.lib.eq=t.value;refilter('lib')}
  else if(k==='pkm'){UI.pick.m=t.value;refilter('pk')}else if(k==='pke'){UI.pick.eq=t.value;refilter('pk')}
  else if(k==='progEx'){UI.progEx=t.value;render()}
  else if(k==='imp'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.sessions)throw 0;S=Object.assign(fresh(),d);save();UI.tab='home';render();toast('Backup imported')}catch(e){toast('That file is not a valid backup.')}};r.readAsText(f)}});
/* ============================== TIMERS / REMINDERS ============================== */
setInterval(()=>{const r=$('#rest');
  if(UI.restEnd>Date.now()){const s=Math.ceil((UI.restEnd-Date.now())/1000);r.style.display='flex';r.innerHTML=`<span>Rest ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}</span><span data-act="skipRest" style="cursor:pointer">Skip</span>`}
  else{if(UI.restEnd){UI.restEnd=0;toast('Rest is over. Next set!');if(navigator.vibrate)navigator.vibrate(300)}r.style.display='none'}
  const el=$('#elapsed');if(el&&S.active){const m=Math.floor((Date.now()-S.active.t)/6e4);el.textContent=`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`}},500);
function checkRemind(){try{const R=S.remind;if(!R||!R.on||!('Notification' in window)||Notification.permission!=='granted')return;
  const d=new Date(),dow=d.getDay()||7,ds=d.toLocaleDateString('sv');if(!R.days.includes(dow)||S.lastRemind===ds)return;
  const[h,m]=R.time.split(':').map(Number);if(d.getHours()*60+d.getMinutes()<h*60+m)return;
  if(S.sessions.some(s=>new Date(s.t).toLocaleDateString('sv')===ds))return;
  S.lastRemind=ds;save();new Notification('Time to train',{body:'IronMap: your workout is planned for today.'})}catch(e){}}
setInterval(checkRemind,60000);checkRemind();
render();
</script>
